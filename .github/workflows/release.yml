name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          wix.exe eula accept wix7

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wails binaries and MSI packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $env:Path = "$env:USERPROFILE\go\bin;$env:Path"
          $env:GOCACHE = Join-Path $PWD ".gocache"

          $tag = "${{ github.ref_name }}"
          $version = "${{ github.ref_name }}".TrimStart("v")
          $projectName = "ihu"
          $binary = "ihu"

          foreach ($arch in @("amd64", "arm64")) {
            $msiArch = if ($arch -eq "amd64") { "x64" } else { "arm64" }
            $sourceDir = Join-Path $PWD "dist/${projectName}_${version}_windows_${arch}"
            $zipFile = Join-Path $PWD "dist/${projectName}_${version}_windows_${arch}.zip"
            $outFile = "dist/${projectName}_${version}_windows_${msiArch}.msi"
            $iconFile = Join-Path $PWD "build/windows/icon.ico"

            New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null

            wails build `
              -clean `
              -s `
              -nopackage `
              -platform "windows/$arch" `
              -o "$binary" `
              -ldflags "-s -w -X main.currentVersion=$tag"

            $builtExe = "build/bin/$binary"
            if (-not (Test-Path $builtExe)) {
              $builtExe = "build/bin/$binary.exe"
            }
            Copy-Item -Path $builtExe -Destination "$sourceDir/$binary.exe" -Force
            Copy-Item -Path "README.md" -Destination "$sourceDir/README.md" -Force
            Copy-Item -Path "COPYING" -Destination "$sourceDir/COPYING" -Force

            Compress-Archive -Path "$sourceDir/*" -DestinationPath $zipFile -Force

            wix build windows/app.wxs `
              -arch $msiArch `
              -d ProjectName=$projectName `
              -d Version=$version `
              -d Binary=$binary `
              -d SourceDir=$sourceDir `
              -d IconFile=$iconFile `
              -out $outFile

            gh release upload "${{ github.ref_name }}" $zipFile --clobber
            gh release upload "${{ github.ref_name }}" $outFile --clobber
          }
