name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MSI packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $projectName = "myapp"      # <-- set to your actual project name
          $binary = "myapp"           # <-- set to your actual binary name

          foreach ($arch in @("amd64", "arm64")) {
            $sourceDir = Get-ChildItem -Path "dist" -Directory |
              Where-Object { $_.Name -like "*windows_$arch*" } |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $sourceDir) {
              Write-Warning "No dist folder found for windows/$arch, skipping"
              continue
            }

            $msiArch = if ($arch -eq "amd64") { "x64" } else { "arm64" }
            $outFile = "dist/${projectName}_${version}_windows_${msiArch}.msi"

            wix build windows/app.wxs `
              -arch $msiArch `
              -d ProjectName=$projectName `
              -d Version=$version `
              -d Binary=$binary `
              -d SourceDir=$sourceDir `
              -out $outFile

            gh release upload "${{ github.ref_name }}" $outFile --clobber
          }